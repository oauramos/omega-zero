<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540">
  <!-- the cart's edges: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="10" width="6" height="524" fill="#fff" fill-opacity="0.3"/>
  <rect x="10" y="0" width="420" height="5" fill="#fff" fill-opacity="0.3"/>
  <rect x="434" y="10" width="6" height="524" fill="#000" fill-opacity="0.45"/>
  <rect x="6" y="535" width="428" height="5" fill="#000" fill-opacity="0.35"/>
  <!-- the grip ridges across the top, where the cart is pulled from the console -->
  <rect x="24" y="20" width="392" height="4" fill="#fff" fill-opacity="0.22"/>
  <rect x="24" y="24" width="392" height="4" fill="#000" fill-opacity="0.45"/>
  <rect x="24" y="36" width="392" height="4" fill="#fff" fill-opacity="0.22"/>
  <rect x="24" y="40" width="392" height="4" fill="#000" fill-opacity="0.45"/>
  <rect x="24" y="52" width="392" height="4" fill="#fff" fill-opacity="0.22"/>
  <rect x="24" y="56" width="392" height="4" fill="#000" fill-opacity="0.45"/>
  <!-- the label's well: shadow along its top and left, a lit lip under and right of it -->
  <rect x="44" y="80" width="352" height="4" fill="#000" fill-opacity="0.45"/>
  <rect x="44" y="84" width="4" height="316" fill="#000" fill-opacity="0.4"/>
  <rect x="48" y="400" width="348" height="4" fill="#fff" fill-opacity="0.25"/>
  <rect x="392" y="84" width="4" height="320" fill="#fff" fill-opacity="0.22"/>
  <!-- the step along the foot, over the contacts -->
  <rect x="24" y="500" width="392" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="24" y="503" width="392" height="2" fill="#fff" fill-opacity="0.15"/>
</svg>

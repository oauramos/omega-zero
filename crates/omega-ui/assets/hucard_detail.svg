<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 340">
  <!-- the card's edge is rounded over: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="12" width="3" height="316" fill="#fff" fill-opacity="0.4"/>
  <rect x="12" y="0" width="192" height="3" fill="#fff" fill-opacity="0.35"/>
  <rect x="213" y="12" width="3" height="316" fill="#000" fill-opacity="0.4"/>
  <rect x="12" y="337" width="192" height="3" fill="#000" fill-opacity="0.3"/>
  <!-- the label sits in a shallow well: a shadow along its top and left, a lit lip under it and to its right -->
  <rect x="6" y="15" width="204" height="2" fill="#000" fill-opacity="0.35"/>
  <rect x="6" y="17" width="2" height="248" fill="#000" fill-opacity="0.3"/>
  <rect x="8" y="265" width="202" height="2" fill="#fff" fill-opacity="0.35"/>
  <rect x="208" y="17" width="2" height="250" fill="#fff" fill-opacity="0.3"/>
  <!-- the grip ridges across the foot, where a thumb pushes the card into the slot -->
  <rect x="36" y="284" width="144" height="2" fill="#000" fill-opacity="0.3"/>
  <rect x="36" y="286" width="144" height="1" fill="#fff" fill-opacity="0.3"/>
  <rect x="36" y="294" width="144" height="2" fill="#000" fill-opacity="0.3"/>
  <rect x="36" y="296" width="144" height="1" fill="#fff" fill-opacity="0.3"/>
  <rect x="36" y="304" width="144" height="2" fill="#000" fill-opacity="0.3"/>
  <rect x="36" y="306" width="144" height="1" fill="#fff" fill-opacity="0.3"/>
  <!-- the contact edge, its fingers showing through the card's bottom lip -->
  <rect x="24" y="322" width="168" height="10" fill="#000" fill-opacity="0.25"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 532">
  <!-- the cart's edges: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="8" width="6" height="516" fill="#fff" fill-opacity="0.4"/>
  <rect x="8" y="0" width="464" height="5" fill="#fff" fill-opacity="0.35"/>
  <rect x="474" y="8" width="6" height="516" fill="#000" fill-opacity="0.4"/>
  <rect x="8" y="527" width="464" height="5" fill="#000" fill-opacity="0.3"/>
  <!-- the label sits in a shallow well: shadow along its top and left, a lit lip under and right of it -->
  <rect x="44" y="40" width="392" height="4" fill="#000" fill-opacity="0.35"/>
  <rect x="44" y="44" width="4" height="272" fill="#000" fill-opacity="0.3"/>
  <rect x="48" y="316" width="392" height="4" fill="#fff" fill-opacity="0.35"/>
  <rect x="436" y="44" width="4" height="276" fill="#fff" fill-opacity="0.3"/>
  <!-- the grip ridges across the foot of the face -->
  <rect x="60" y="352" width="360" height="5" fill="#000" fill-opacity="0.3"/>
  <rect x="60" y="357" width="360" height="2" fill="#fff" fill-opacity="0.3"/>
  <rect x="60" y="376" width="360" height="5" fill="#000" fill-opacity="0.3"/>
  <rect x="60" y="381" width="360" height="2" fill="#fff" fill-opacity="0.3"/>
  <rect x="60" y="400" width="360" height="5" fill="#000" fill-opacity="0.3"/>
  <rect x="60" y="405" width="360" height="2" fill="#fff" fill-opacity="0.3"/>
  <rect x="60" y="424" width="360" height="5" fill="#000" fill-opacity="0.3"/>
  <rect x="60" y="429" width="360" height="2" fill="#fff" fill-opacity="0.3"/>
  <rect x="60" y="448" width="360" height="5" fill="#000" fill-opacity="0.3"/>
  <rect x="60" y="453" width="360" height="2" fill="#fff" fill-opacity="0.3"/>
  <!-- the screws either side near the foot -->
  <circle cx="30" cy="492" r="7" fill="#000" fill-opacity="0.45"/>
  <circle cx="450" cy="492" r="7" fill="#000" fill-opacity="0.45"/>
</svg>

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Check ScreenScraper's key
        env:
          OMEGA_SS_DEVID: ${{ secrets.OMEGA_SS_DEVID }}
          OMEGA_SS_DEVPASSWORD: ${{ secrets.OMEGA_SS_DEVPASSWORD }}
        run: |
          set -eu
          # A key ScreenScraper turns away would only show on a console, as Cart Labels saying
          # it refused this build. A tag goes out to players, so it stops here without a key; a
          # build by hand only warns. A ScreenScraper that cannot be asked holds nothing up.
          if [ -z "$OMEGA_SS_DEVID" ] || [ -z "$OMEGA_SS_DEVPASSWORD" ]; then
            case "$GITHUB_REF" in
            refs/tags/*)
              echo "::error::OMEGA_SS_DEVID and OMEGA_SS_DEVPASSWORD must both be set to release"
              exit 1
              ;;
            esac
            echo "::warning::No ScreenScraper key: Cart Labels will say it cannot reach ScreenScraper"
            exit 0
          fi
          reply="$RUNNER_TEMP/screenscraper-reply"
          rm -f "$reply"
          status=0
          # the softname label_sync.rs sends
          code="$(curl -s -m 30 --retry 2 -A omega-zero -o "$reply" -w '%{http_code}' -G \
            https://api.screenscraper.fr/api2/ssinfraInfos.php \
            --data-urlencode "devid=$OMEGA_SS_DEVID" \
            --data-urlencode "devpassword=$OMEGA_SS_DEVPASSWORD" \
            -d softname=omega-zero -d output=json)" || status=$?
          if [ "$code" = 403 ] || grep -qs 'Erreur de login' "$reply"; then
            echo "::error::ScreenScraper refused OMEGA_SS_DEVID and OMEGA_SS_DEVPASSWORD"
            exit 1
          fi
          if [ "$code" != 200 ]; then
            echo "::warning::Could not check ScreenScraper's key (HTTP $code, curl $status)"
          fi

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Name the tree
        # after the tag or branch, its slashes made dashes: an artifact's name takes none
        run: echo "TREE=omega-zero-$(printf %s "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"

      - name: Build the tree
        env:
          # ScreenScraper's key for omega-zero, for the Cart Labels screen. Without it the
          # screen says the build cannot reach ScreenScraper.
          OMEGA_SS_DEVID: ${{ secrets.OMEGA_SS_DEVID }}
          OMEGA_SS_DEVPASSWORD: ${{ secrets.OMEGA_SS_DEVPASSWORD }}
        run: task dist:device OUT="$TREE"

      - name: Check what is about to ship
        run: |
          set -eu
          out="$TREE"
          file "$out/System/omega-zero" | grep -q aarch64
          # each core an aarch64 library a frontend can open: retro_init and retro_run exported
          for lib in mgba gpsp snes9x mednafen_supafaust pcsx_rearmed mednafen_pce_fast fceumm genesis_plus_gx; do
            so="$out/System/${lib}_libretro.so"
            file "$so" | grep -q aarch64
            nm -D --defined-only "$so" | grep -qw retro_init
            nm -D --defined-only "$so" | grep -qw retro_run
          done
          test -x "$out/System/omega-zero"
          for size in 640x480 720x480 720x720; do
            test -f "$out/System/bootlogo-$size.bmp"
          done
          test -f "$out/System/probe.sh"
          test -f "$out/System/wifi.sh"
          test -f "$out/System/bluetooth.sh"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done
          # Supafaust, pcsx_rearmed, Beetle PCE Fast and FCEUmm are GPL-2.0 as gpSP is, Genesis
          # Plus GX's licence asks for its source beside a build, and Snes9x holds the LGPL-2.1
          # snes_ntsc filter: each one's source, build stamp and patches ship beside it
          for name in snes9x supafaust pcsx_rearmed pce_fast fceumm genesis_plus_gx; do
            src_sha="$(cat "vendor/$name-src.sha")"
            test -f "$out/System/licenses/$name-${src_sha}.tar.gz"
            test -f "$out/System/licenses/$name-${src_sha}.meta"
            grep -qx "commit=${src_sha}" "$out/System/licenses/$name-${src_sha}.meta"
            for p in cores/$name/*.patch; do
              [ -f "$p" ] || continue
              test -f "$out/System/licenses/$name-$(basename "$p")"
            done
          done
          for licence in snes9x-non-commercial snes9x-snes_ntsc-LGPL-2.1 supafaust-GPL-2.0 \
            pcsx_rearmed-GPL-2.0 pce_fast-GPL-2.0 fceumm-GPL-2.0 genesis_plus_gx-non-commercial; do
            test -f "$out/System/licenses/$licence.txt"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="$TREE"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          For Anbernic H700 handhelds running [BaseOS](https://github.com/pvaibhav/BaseOS): made for the RG35XX SP, and also run on the RG SP. Other BaseOS devices are untested; see the [wiki](https://github.com/oauramos/omega-zero/wiki).

          Unzip and copy the contents of \`omega-zero-${GITHUB_REF_NAME}/\` to the root of the card omega-zero runs from (SD1 on its own, or SD2 beside it); the [wiki](https://github.com/oauramos/omega-zero/wiki/Installing) has the steps. See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).

          Emulation by mGBA (MPL-2.0) and gpSP (GPL-2.0) for the Game Boys, Snes9x (free for non-commercial use only) and Supafaust (Mednafen's snes_faust, GPL-2.0) for the SNES, PCSX ReARMed (GPL-2.0) for the PlayStation, Beetle PCE Fast (Mednafen's pce_fast, GPL-2.0) for the PC Engine, FCEUmm (GPL-2.0) for the NES, and Genesis Plus GX (free for non-commercial use only) for the Mega Drive. Their licences, patches and source (mGBA's aside) are in \`System/licenses/\`. omega-zero is free software under the GPL-3.0-or-later; its credits are in the README.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md